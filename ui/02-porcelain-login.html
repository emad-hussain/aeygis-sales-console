<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Porcelain — login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ═══════════════════════════════════════════════════════════════════════
     PORCELAIN login — Solstice's split composition, spoken in Porcelain.
     Where Solstice bleeds a teal gradient to the page edge, Porcelain does
     what Porcelain always does: it FLOATS. The brand panel is one huge ink
     card hovering on warm paper with a big soft shadow; the form is a white
     card beside it. Same bones as Solstice, entirely this direction's skin.
     ═══════════════════════════════════════════════════════════════════════ */
  :root {
    --ground: #f6f5f2;
    --card: #ffffff;
    --panel-ink: #22262d;
    --panel-ink-2: #2b3038;
    --line: #ebe8e2;
    --line-2: #ddd9d0;
    --ink: #1f2329;
    --body: #545b66;
    --dim: #8a919c;
    --accent: #0b8585;
    --accent-ink: #085e5e;
    --accent-bright: #43c6b8;
    --accent-tint: #e2f2f0;
    --amber: #9a6a12;  --amber-tint: #faf0da;
    --shadow: 0 2px 4px rgba(31,35,41,.04), 0 24px 60px -20px rgba(31,35,41,.16);
    --shadow-big: 0 4px 10px rgba(31,35,41,.06), 0 40px 90px -28px rgba(31,35,41,.35);
    --font: 'Manrope', system-ui, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
    --ease: cubic-bezier(.2,.9,.25,1);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font); font-size: 14px; color: var(--body);
    background: var(--ground); overflow: hidden;
    display: grid; grid-template-columns: minmax(0, 47%) minmax(0, 53%);
    gap: 0;
  }
  /* Porcelain's soft ground blobs */
  .blob { position: fixed; border-radius: 50%; filter: blur(100px); pointer-events: none; }
  .blob.a { width: 520px; height: 520px; background: rgba(11,133,133,.10); top: -180px; right: -140px; }
  .blob.b { width: 440px; height: 440px; background: rgba(232,184,74,.09); bottom: -200px; left: 30%; }

  /* ── brand panel: one huge floating ink card ─────────────────────── */
  .brandwrap { padding: 22px 0 22px 22px; display: grid; }
  .brandside {
    /* Layered: legibility overlay on top, photo in the middle, and the ink
       gradient underneath as a graceful fallback if the image cannot load. */
    background:
      linear-gradient(178deg, rgba(20,24,30,.55) 0%, rgba(20,24,30,.30) 40%, rgba(13,26,28,.82) 76%, rgba(10,22,24,.95) 100%),
      url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=1400&q=70') center/cover no-repeat,
      linear-gradient(165deg, var(--panel-ink), var(--panel-ink-2));
    border-radius: 26px; color: #c9cfd8; padding: 40px 44px;
    position: relative; overflow: hidden; display: flex; flex-direction: column;
    box-shadow: var(--shadow-big);
    animation: pop .6s var(--ease) both .05s;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(16px) scale(.985); } }
  /* soft interior glow — Porcelain pastels, not Solstice gold */
  .brandside::before {
    content: ''; position: absolute; width: 480px; height: 480px; border-radius: 50%;
    background: rgba(67,198,184,.13); filter: blur(90px); right: -160px; top: -160px;
  }
  .brandside::after {
    content: ''; position: absolute; width: 380px; height: 380px; border-radius: 50%;
    background: rgba(109,91,208,.10); filter: blur(90px); left: -120px; bottom: -140px;
  }

  .lockup { display: flex; align-items: center; gap: 12px; position: relative; z-index: 1; }
  .mark {
    width: 42px; height: 42px; border-radius: 13px; background: var(--accent); color: #fff;
    display: grid; place-items: center; font-weight: 800; font-size: 20px;
    box-shadow: 0 10px 24px -6px rgba(11,133,133,.6);
  }
  .lockup b { font-size: 17px; font-weight: 800; color: #fff; letter-spacing: -.01em; display: block; }
  .lockup span { font-size: 12px; color: var(--dim); }

  .hero { margin-top: auto; max-width: 400px; position: relative; z-index: 1; }
  .hero h1 {
    font-size: 30px; font-weight: 800; color: #fff; line-height: 1.22; letter-spacing: -.025em;
    animation: rise .6s var(--ease) both .22s;
  }
  .hero h1 em { font-style: normal; color: var(--accent-bright); }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  .hero p {
    margin-top: 12px; font-size: 13.5px; color: #9aa2ae; line-height: 1.65;
    animation: rise .6s var(--ease) both .32s;
  }

  /* stat tiles — the console's queue-card tiles, dark-adapted */
  .stats { display: flex; gap: 10px; margin-top: 26px; animation: rise .6s var(--ease) both .42s; }
  .stat {
    flex: 1; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.11);
    border-radius: 13px; padding: 11px 12px; text-align: center;
  }
  .stat b { display: block; color: #fff; font-size: 19px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 9.5px; color: var(--dim); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }

  .bfoot {
    margin-top: 30px; font-family: var(--mono); font-size: 10px; color: #7d8590;
    position: relative; z-index: 1; animation: rise .6s var(--ease) both .5s;
  }

  /* ── form side ───────────────────────────────────────────────────── */
  .formside { display: grid; place-items: center; padding: 40px; }
  .formcard {
    width: 400px; background: var(--card); border-radius: 22px; box-shadow: var(--shadow);
    padding: 30px 32px 26px; animation: pop .55s var(--ease) both .18s;
  }
  .formcard h2 { font-size: 21px; font-weight: 800; color: var(--ink); letter-spacing: -.02em; }
  .sub { font-size: 13px; color: var(--dim); margin: 5px 0 24px; }

  .field { margin-bottom: 14px; animation: pop .5s var(--ease) both; }
  .field:nth-of-type(1) { animation-delay: .28s; } .field:nth-of-type(2) { animation-delay: .35s; }
  label { display: block; font-size: 12.5px; font-weight: 700; color: var(--ink); margin-bottom: 6px; }
  .input {
    display: flex; align-items: center; gap: 10px;
    background: #faf9f7; border: 1.5px solid var(--line); border-radius: 12px;
    padding: 11px 14px; transition: all .18s var(--ease);
  }
  .input input { all: unset; flex: 1; font-family: var(--font); font-size: 14px; color: var(--ink); font-weight: 500; }
  .input.focus { background: #fff; border-color: var(--accent); box-shadow: 0 0 0 4px rgba(11,133,133,.12); }
  .icon { color: var(--dim); font-size: 13px; }

  .row { display: flex; justify-content: space-between; align-items: center; margin: 2px 0 20px; animation: pop .5s var(--ease) both .4s; }
  .remember { display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--body); font-weight: 500; }
  .box {
    width: 17px; height: 17px; border-radius: 6px; background: var(--accent); position: relative;
    box-shadow: 0 3px 8px -2px rgba(11,133,133,.5);
  }
  .box::after { content: '✓'; position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-size: 10.5px; font-weight: 800; }
  .row a { color: var(--accent-ink); font-size: 12.5px; font-weight: 700; text-decoration: none; }
  .row a:hover { text-decoration: underline; }

  .btn {
    width: 100%; font-family: var(--font); font-size: 14.5px; font-weight: 800; padding: 13px;
    border: none; border-radius: 13px; cursor: pointer;
    background: var(--accent); color: #fff;
    box-shadow: 0 12px 26px -10px rgba(11,133,133,.6);
    transition: all .18s var(--ease);
    animation: pop .5s var(--ease) both .45s;
  }
  .btn:hover { background: #0a7676; transform: translateY(-1px); box-shadow: 0 16px 32px -10px rgba(11,133,133,.65); }
  .alt {
    width: 100%; margin-top: 10px; font-family: var(--font); font-size: 13px; font-weight: 700; padding: 11px;
    border: 1.5px solid var(--line-2); border-radius: 13px; background: #fff; color: var(--body);
    cursor: pointer; transition: all .18s var(--ease);
    animation: pop .5s var(--ease) both .5s;
  }
  .alt:hover { border-color: var(--accent); color: var(--accent-ink); transform: translateY(-1px); }

  .note {
    margin-top: 18px; padding: 12px 14px; border-radius: 13px;
    background: var(--accent-tint); font-size: 12px; color: var(--body); line-height: 1.6;
    animation: pop .5s var(--ease) both .55s;
  }
  .note b { color: var(--accent-ink); font-weight: 800; }
  .note.gold { background: var(--amber-tint); color: #6f5722; margin-top: 8px; animation-delay: .6s; }
  .note.gold b { color: var(--amber); }

  .under {
    text-align: center; margin-top: 16px; font-family: var(--mono); font-size: 10.5px; color: var(--dim);
    animation: pop .5s var(--ease) both .65s;
  }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="blob a"></div><div class="blob b"></div>

<div class="brandwrap">
  <aside class="brandside">
    <div class="lockup">
      <div class="mark">a</div>
      <div><b>aeygis</b><span>Sales console</span></div>
    </div>

    <div class="hero">
      <h1>From first assessment to <em>signed proposal</em>.</h1>
      <p>The Aeygis workspace for client assessments, pricing, and proposal approvals.</p>
    </div>
  </aside>
</div>

<main class="formside">
  <div class="formcard">
    <h2>Sign in</h2>
    <p class="sub">Welcome back — use your staff account.</p>

    <div class="field">
      <label>Email</label>
      <div class="input"><span class="icon">✉</span><input value="s.chen@aeygis.com"></div>
    </div>
    <div class="field">
      <label>Password</label>
      <div class="input focus"><span class="icon">🔒</span><input type="password" value="••••••••••••"><span class="icon">👁</span></div>
    </div>

    <div class="row">
      <span class="remember"><span class="box"></span>Remember this device</span>
      <a href="#">Forgot password?</a>
    </div>

    <button class="btn">Sign in to console</button>
    <button class="alt">Sign in with recovery code</button>

  </div>
</main>
</body>
</html>
